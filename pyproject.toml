[project]
name = "elt-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Salomao Valentim", email = "salomaovalentim31@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.113",
    "dbt-postgres>=1.11.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
elt-project = "elt_project:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
